<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory List</title>
    <link rel="stylesheet" href="/inventory.css">
</head>

<body>

    <h1>Inventory List</h1>

    <!-- Formulario para añadir item -->
    <form id="add-item-form">
        <input type="text" id="sku" name="sku" placeholder="SKU" required>
        <input type="text" id="warehouse" name="warehouse" placeholder="Warehouse" required>
        <input type="number" id="onHand" name="onHand" placeholder="On Hand" required>
        <input type="number" id="reserved" name="reserved" placeholder="Reserved" required>
        <button type="submit">Añadir</button>
    </form>

    <!-- Mostrar los items de inventario -->
    <h2>Items</h2>
    <table>
        <thead>
            <tr>
                <th>SKU</th>
                <th>Warehouse</th>
                <th>On Hand</th>
                <th>Reserved</th>
                <th>Available</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <!-- Iterar sobre los items de inventario -->
            <tr th:each="item : ${inventoryItems}">
                <td th:text="${item.sku}">SKU</td>
                <td th:text="${item.warehouse}">Warehouse</td>
                <td th:text="${item.onHand}">On Hand</td>
                <td th:text="${item.reserved}">Reserved</td>
                <td th:text="${item.available}">Available</td>
                <td>
                    <button class="delete-item-btn"
                        th:attr="data-sku=${item.sku}, data-warehouse=${item.warehouse}">Eliminar</button>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Formulario para aplicar movimiento -->
    <h2>Aplicar Movimiento</h2>
    <form id="apply-movement-form">
        <input type="text" id="movement-sku" name="sku" placeholder="SKU" required>
        <input type="text" id="movement-warehouse" name="warehouse" placeholder="Warehouse" required>
        <input type="text" id="movement-type" name="type" placeholder="Tipo (IN/OUT/RESERVATION/RELEASE)" required>
        <input type="number" id="movement-quantity" name="quantity" placeholder="Cantidad" required>
        <input type="text" id="movement-reason" name="reason" placeholder="Razón" required>
        <button type="submit">Aplicar</button>
    </form>

    <!-- Mostrar los movimientos -->
    <h2>Movements</h2>
    <table>
        <thead>
            <tr>
                <th>SKU</th>
                <th>Warehouse</th>
                <th>Type</th>
                <th>Quantity</th>
                <th>Reason</th>
                <th>Occurred At</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <!-- Iterar sobre los movimientos -->
            <tr th:each="movement : ${movementsList}">
                <td th:text="${movement.sku}">SKU</td>
                <td th:text="${movement.warehouse}">Warehouse</td>
                <td th:text="${movement.type}">Type</td>
                <td th:text="${movement.quantity}">Quantity</td>
                <td th:text="${movement.reason}">Reason</td>
                <td th:text="${movement.occurredAt}">Occurred At</td>
                <td>
                    <form th:action="@{/inventory/delete-movement}" method="post" class="inline acciones-form">
                        <input type="hidden" name="sku" th:value="${movement.sku}" />
                        <input type="hidden" name="warehouse" th:value="${movement.warehouse}" />
                        <input type="hidden" name="type" th:value="${movement.type}" />
                        <input type="hidden" name="occurredAt" th:value="${movement.occurredAt}" />
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <script>
        // Función para manejar el envío del formulario para añadir item
        document.getElementById("add-item-form").addEventListener("submit", function (event) {
            event.preventDefault(); // Evita que el formulario se envíe de forma tradicional

            // Obtener los valores del formulario
            const formData = {
                sku: document.getElementById("sku").value,
                warehouse: document.getElementById("warehouse").value,
                onHand: parseInt(document.getElementById("onHand").value),
                reserved: parseInt(document.getElementById("reserved").value)
            };

            // Crear el cuerpo JSON
            const jsonData = JSON.stringify(formData);

            // Enviar los datos como JSON al servidor utilizando fetch
            fetch('/items', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json' // Especificamos que es un JSON
                },
                body: jsonData
            })
                .then(response => response.json())
                .then(data => {
                    console.log('Item creado:', data);
                    alert('Item creado correctamente');
                    // Redirigir o actualizar la vista si es necesario
                    window.location.reload(); // Recarga la página para ver el nuevo item
                })
                .catch(error => {
                    console.error('Error al crear el item:', error);
                    alert('Hubo un error al crear el item');
                });
        });

        // Función para manejar el envío del formulario para aplicar movimiento
        document.getElementById("apply-movement-form").addEventListener("submit", function (event) {
            event.preventDefault(); // Evita que el formulario se envíe de forma tradicional

            // Obtener los valores del formulario
            const movementData = {
                sku: document.getElementById("movement-sku").value,
                warehouse: document.getElementById("movement-warehouse").value,
                type: document.getElementById("movement-type").value,
                quantity: parseInt(document.getElementById("movement-quantity").value),
                reason: document.getElementById("movement-reason").value
            };

            // Crear el cuerpo JSON
            const movementJsonData = JSON.stringify(movementData);

            // Enviar los datos como JSON al servidor utilizando fetch
            fetch('/items/movements', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json' // Especificamos que es un JSON
                },
                body: movementJsonData
            })
                .then(response => {
                    return response.text().then(text => ({ ok: response.ok, status: response.status, text }));
                })
                .then(({ ok, status, text }) => {
                    if (ok) {
                        console.log('Movimiento aplicado:', text);
                        alert('Movimiento aplicado correctamente');
                        window.location.reload(); // Recarga la página para ver el nuevo movimiento
                    } else {
                        console.error('Error al aplicar movimiento:', status, text);
                        alert('Hubo un error al aplicar el movimiento: ' + text);
                    }
                })
                .catch(error => {
                    console.error('Error al aplicar el movimiento:', error);
                    alert('Hubo un error al aplicar el movimiento');
                });
        });
    </script>
    <script>
        // Agregar eventos para eliminar un item
        const deleteButtons = document.querySelectorAll('.delete-item-btn');

        deleteButtons.forEach(button => {
            button.addEventListener('click', function (event) {
                const sku = button.getAttribute('data-sku');
                const warehouse = button.getAttribute('data-warehouse');

                // Confirmación antes de eliminar el item
                if (confirm(`¿Estás seguro de que deseas eliminar el item con SKU ${sku} del almacén ${warehouse}?`)) {
                    // Enviar la solicitud DELETE usando fetch
                    fetch(`/items/${encodeURIComponent(sku)}/warehouse/${encodeURIComponent(warehouse)}`, {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    })
                        .then(response => {
                            if (response.ok) {
                                alert('Item eliminado correctamente');
                                window.location.reload(); // Recargar la página para reflejar la eliminación
                            } else {
                                return response.text().then(text => {
                                    alert(text || 'Error al eliminar');
                                });
                            }
                        })
                        .catch(error => {
                            console.error('Error al eliminar el item:', error);
                            alert('Hubo un error al eliminar el item');
                        });
                }
            });
        });
    </script>
</body>

</html>
